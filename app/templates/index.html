<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LLMOps Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e1e4e8;
      padding: 2rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #fff;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6e7681;
      margin-bottom: 2rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1.25rem;
    }

    .card-label {
      font-size: 0.75rem;
      color: #6e7681;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }

    .card-value {
      font-size: 1.8rem;
      font-weight: 600;
      color: #fff;
    }

    .card-sub {
      font-size: 0.8rem;
      color: #6e7681;
      margin-top: 0.25rem;
    }

    .card.green  .card-value { color: #3fb950; }
    .card.blue   .card-value { color: #58a6ff; }
    .card.amber  .card-value { color: #d29922; }
    .card.purple .card-value { color: #bc8cff; }

    .loading { color: #6e7681; font-size: 0.85rem; }
  </style>
</head>
<body>

  <h1>LLMOps Monitor</h1>
  <p class="subtitle" id="last-updated">Loading...</p>

  <div class="cards">
    <div class="card blue">
      <div class="card-label">Total Requests</div>
      <div class="card-value" id="total-requests">—</div>
      <div class="card-sub" id="top-model">—</div>
    </div>
    <div class="card green">
      <div class="card-label">Estimated Cost</div>
      <div class="card-value" id="total-cost">—</div>
      <div class="card-sub">hypothetical OpenAI equiv.</div>
    </div>
    <div class="card amber">
      <div class="card-label">Avg Latency</div>
      <div class="card-value" id="avg-latency">—</div>
      <div class="card-sub" id="p95-latency">—</div>
    </div>
    <div class="card purple">
      <div class="card-label">Total Tokens</div>
      <div class="card-value" id="total-tokens">—</div>
      <div class="card-sub">across all requests</div>
    </div>
  </div>

  <script>
    async function loadStats() {
      try {
        const [summary, latency] = await Promise.all([
          fetch('/stats/summary').then(r => r.json()),
          fetch('/stats/latency').then(r => r.json()),
        ]);

        document.getElementById('total-requests').textContent =
          summary.total_requests ?? '0';

        document.getElementById('top-model').textContent =
          summary.top_model ? `top model: ${summary.top_model}` : '—';

        document.getElementById('total-cost').textContent =
          summary.total_cost_usd != null
            ? '$' + summary.total_cost_usd.toFixed(6)
            : '$0.000000';

        document.getElementById('avg-latency').textContent =
          summary.avg_latency_ms != null
            ? (summary.avg_latency_ms / 1000).toFixed(2) + 's'
            : '—';

        document.getElementById('p95-latency').textContent =
          latency.p95 != null
            ? `p95: ${(latency.p95 / 1000).toFixed(2)}s`
            : '—';

        document.getElementById('total-tokens').textContent =
          summary.total_tokens ?? '0';

        document.getElementById('last-updated').textContent =
          'Last updated: ' + new Date().toLocaleTimeString();

      } catch (err) {
        console.error('Failed to load stats:', err);
      }
    }

    // Load on page open, then refresh every 30 seconds
    loadStats();
    setInterval(loadStats, 30000);
  </script>

</body>
</html>
